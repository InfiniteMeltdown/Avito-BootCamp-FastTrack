[project]
name = "avito-bootcamp-fasttrack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "transformers>=5.17.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "ipykernel>=7.3.0",
    "pandas>=3.0.6",
    "paddleocr>=3.7.0",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu132", marker = "sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu132", marker = "sys_platform == 'win32'" },
]
